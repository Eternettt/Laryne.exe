<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable - Laryne.exe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #f9c6dd, #e0729f);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: #fdf3f7;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    padding: 40px 32px;
    max-width: 420px;
  }
  h1 { color: #7a2350; margin-bottom: 12px; font-size: 48px; }
  h2 { color: #5a1a38; margin-bottom: 12px; font-size: 20px; }
  p { color: #4a1a30; margin-bottom: 24px; line-height: 1.5; }
  a.btn {
    display: inline-block;
    padding: 12px 24px;
    background: linear-gradient(#c2477a, #7a2350);
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
  }
  a.btn:hover { background: linear-gradient(#d1588c, #8a2a5c); }
</style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Page introuvable</h2>
    <p>La page que tu cherches n'existe pas ou plus.</p>
    <a class="btn" href="index.html">Retour à l'accueil</a>
  </div>
</body>
</html>
