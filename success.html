<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci ! - Laryne.exe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #f9c6dd, #e0729f);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: #fdf3f7;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    padding: 40px 32px;
    max-width: 420px;
  }
  h1 { color: #7a2350; margin-bottom: 12px; font-size: 26px; }
  p { color: #4a1a30; margin-bottom: 24px; line-height: 1.5; }
  a.btn {
    display: inline-block;
    padding: 12px 24px;
    background: linear-gradient(#c2477a, #7a2350);
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
  }
  a.btn:hover { background: linear-gradient(#d1588c, #8a2a5c); }
  .order-id { font-size: 12px; color: #9a5c78; margin-top: 18px; }

  .order-summary {
    text-align: left;
    background: #fff;
    border: 1px solid #f6c3dc;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .order-summary .line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
    color: #4a1a30;
    padding: 4px 0;
  }
  .order-summary .line + .line { border-top: 1px solid #fbdcec; }
  .order-summary .total {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    color: #7a2350;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 2px solid #ea8fb8;
  }
  .no-account-note {
    font-size: 12px;
    color: #9a5c78;
    margin-top: -10px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="result-title">✅ Paiement confirmé</h1>
    <p id="result-text">Merci pour ta commande sur Laryne.exe ! Un e-mail de confirmation t'a été envoyé par Stripe.</p>

    <div class="order-summary" id="order-summary" style="display:none;"></div>
    <p class="no-account-note" id="no-account-note" style="display:none;">
      Connecte-toi la prochaine fois avant de payer pour retrouver cette commande dans « Mes achats ».
    </p>

    <a class="btn" href="index.html">Retour à l'accueil</a>
    <div class="order-id" id="order-id"></div>
  </div>

  <script src="shared-data.js"></script>
  <script>
    // Le statut affiché vient TOUJOURS du serveur (voir
    // /api/orders/by-session.js, lui-même alimenté uniquement par le webhook
    // Stripe vérifié par signature — voir api/webhook.js). Cette page
    // n'affirme jamais elle-même qu'un paiement a réussi : elle affiche ce
    // que la base de données sait vraiment.
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('order-id').textContent = 'Référence : ' + sessionId;
    }

    function renderOrder(order) {
      const summaryEl = document.getElementById('order-summary');
      if (order.items && order.items.length) {
        summaryEl.style.display = 'block';
        summaryEl.innerHTML = order.items.map(it => `
          <div class="line">
            <span>${stringzEscapeHtml(it.name)}${it.qty > 1 ? ' × ' + it.qty : ''}</span>
            <span>${(it.unitPrice * it.qty).toFixed(2).replace('.', ',')} €</span>
          </div>
        `).join('') + `
          <div class="total"><span>Total</span><span>${(order.total || 0).toFixed(2).replace('.', ',')} €</span></div>
        `;
      }
      if (!order.linkedToAccount) {
        document.getElementById('no-account-note').style.display = 'block';
      }
    }

    function showState(title, text) {
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-text').textContent = text;
    }

    async function pollOrder(sessionId, attemptsLeft) {
      const order = await stringzFetchOrderBySession(sessionId);

      if (!order) {
        showState('Commande introuvable', "On ne retrouve pas cette commande. Si le paiement a bien été débité, écris-nous à contact@laryne.exe avec la référence ci-dessous.");
        return;
      }

      if (order.status === 'paid') {
        showState('✅ Paiement confirmé', "Merci pour ta commande sur Laryne.exe ! Un e-mail de confirmation t'a été envoyé par Stripe.");
        renderOrder(order);
        return;
      }

      if (order.status === 'failed') {
        showState('❌ Paiement non abouti', "Le paiement n'a pas pu être confirmé (échec ou session expirée). Aucune somme ne devrait avoir été débitée ; tu peux retenter ta commande.");
        return;
      }

      // status === 'pending' : le webhook Stripe peut mettre quelques
      // secondes à arriver après la redirection. On réessaie un peu avant
      // d'afficher un message d'attente définitif.
      if (attemptsLeft > 0) {
        setTimeout(() => pollOrder(sessionId, attemptsLeft - 1), 1500);
      } else {
        showState('⏳ Confirmation en cours', "Ton paiement est en cours de confirmation. Ça peut prendre quelques instants — actualise cette page dans une minute, ou consulte « Mes achats » depuis ton compte.");
      }
    }

    if (sessionId) {
      pollOrder(sessionId, 4);
    } else {
      showState('Retour à la boutique', "Aucune commande à afficher ici. Si tu penses avoir payé, vérifie « Mes achats » depuis ton compte ou écris-nous.");
    }
  </script>
<footer id="stringz-legal-footer">
  <a href="mentions-legales.html">Mentions légales</a>
  <a href="confidentialite.html">Confidentialité</a>
  <a href="cgv.html">CGV</a>
  <a href="livraison.html">Livraison</a>
</footer>
<style>
  #stringz-legal-footer {
    text-align: center;
    padding: 16px 10px 24px;
    font-size: 11px;
  }
  #stringz-legal-footer a {
    color: #fff;
    text-decoration: underline;
    margin: 0 8px;
    opacity: 0.9;
  }
  #stringz-legal-footer a:hover { opacity: 1; }
</style>
</body>
</html>
