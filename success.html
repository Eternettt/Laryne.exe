<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci ! - Laryne.exe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #f9c6dd, #e0729f);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: #fdf3f7;
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    padding: 40px 32px;
    max-width: 420px;
  }
  h1 { color: #7a2350; margin-bottom: 12px; font-size: 26px; }
  p { color: #4a1a30; margin-bottom: 24px; line-height: 1.5; }
  a.btn {
    display: inline-block;
    padding: 12px 24px;
    background: linear-gradient(#c2477a, #7a2350);
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
  }
  a.btn:hover { background: linear-gradient(#d1588c, #8a2a5c); }
  .order-id { font-size: 12px; color: #9a5c78; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ Paiement confirmé</h1>
    <p>Merci pour ta commande sur Laryne.exe ! Un e-mail de confirmation t'a été envoyé par Stripe.</p>
    <a class="btn" href="index.html">Retour à l'accueil</a>
    <div class="order-id" id="order-id"></div>
  </div>

  <script>
    // Affiche l'identifiant de session Stripe si présent dans l'URL (utile pour le support client)
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('order-id').textContent = 'Référence : ' + sessionId;
    }
  </script>
</body>
</html>
