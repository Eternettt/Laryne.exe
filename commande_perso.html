<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande perso - Laryne.exe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #333;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #quit-btn {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 500;
    padding: 7px 16px;
    background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 48%, #dcdcdc 50%, #ffffff 100%);
    color: #7a2350;
    border: 3px solid #4a3242;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #999, 0 6px 10px rgba(0,0,0,0.25);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  #quit-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #999, 0 2px 4px rgba(0,0,0,0.25);
  }
  #quit-btn:hover { background: #fff; }

  #legal-link-btn {
    position: fixed;
    bottom: 10px; left: 10px;
    z-index: 500;
    font-size: 10px;
    color: #999;
    text-decoration: underline;
    background: rgba(255,255,255,0.7);
    padding: 3px 8px;
    border-radius: 6px;
  }

  main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 900px;
    text-align: center;
  }
  .screen.active { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .panel-title { font-size: 20px; margin-bottom: 30px; color: #5a1a38; font-weight: normal; }

  /* ---- Pantone / motif : rangées de cartes cliquables ---- */
  .picker-row {
    display: flex;
    justify-content: center;
    gap: 26px;
    flex-wrap: wrap;
  }
  .pantone-card {
    width: 150px;
    background: #fff;
    border: 1px solid #ddd;
    box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    padding: 10px 10px 14px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .pantone-card:hover { transform: translateY(-6px); box-shadow: 0 14px 26px rgba(0,0,0,0.22); }
  .pantone-card.falling {
    transition: transform 0.6s cubic-bezier(.55,0,1,.45), opacity 0.4s ease 0.2s;
    transform: translate(var(--fall-x, 0px), 520px) rotate(var(--fall-rot, 60deg)) !important;
    opacity: 0;
    pointer-events: none;
  }
  .pantone-swatch { width: 100%; height: 90px; margin-bottom: 8px; }
  .pantone-code { font-weight: bold; font-size: 12px; color: #111; }
  .pantone-name { font-size: 10px; color: #555; }

  .motif-swatch-card {
    width: 130px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .motif-swatch-card:hover { transform: translateY(-6px); box-shadow: 0 14px 26px rgba(0,0,0,0.2); }
  .motif-swatch { height: 80px; }
  .motif-swatch-card .label { text-align: center; padding: 8px 4px; font-size: 12px; font-weight: bold; color: #5a1a38; }

  /* ---- Cooking mama : forme ---- */
  .clock-wrap { display: flex; justify-content: center; margin-bottom: 6px; }
  .clock {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid #7a2350;
    position: relative;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }
  .clock .hand { position: absolute; background: #7a2350; left: 50%; bottom: 50%; transform-origin: bottom center; border-radius: 2px; }
  .clock .hour { width: 3px; height: 15px; margin-left: -1.5px; animation: rotateHour 6s linear infinite; }
  .clock .minute { width: 2px; height: 22px; margin-left: -1px; animation: rotateMinute 3s linear infinite; }
  @keyframes rotateHour { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes rotateMinute { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  #let-cook-banner {
    display: inline-block;
    background: linear-gradient(#ff9ecb, #d8388c);
    color: #fff;
    padding: 9px 24px;
    border-radius: 20px;
    font-size: 17px;
    font-weight: bold;
    margin: 8px 0 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  #shape-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 16px;
    max-width: 700px;
    margin: 0 auto;
  }
  .shape-card {
    background: #fdf3f7;
    border: 2px solid #ea8fb8;
    border-radius: 10px;
    padding: 18px 10px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .shape-card:hover { transform: translateY(-5px); box-shadow: 0 10px 18px rgba(0,0,0,0.18); }
  .shape-card .shape-icon { font-size: 36px; margin-bottom: 6px; }
  .shape-card b { font-size: 13px; }

  /* ---- popups ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fdf3f7; border-radius: 10px; width: 300px; max-width: 88vw; box-shadow: 0 14px 30px rgba(0,0,0,0.4); overflow: hidden; }
  .modal-titlebar {
    background: linear-gradient(90deg, #8f0f4f, #d8388c);
    color: #fff; padding: 8px 12px; font-weight: bold;
    display: flex; justify-content: space-between; align-items: center; font-size: 13px;
  }
  .modal-titlebar .x { cursor: pointer; }
  .modal-body { padding: 18px; text-align: center; }
  .size-grid, .color-swatch-grid { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .size-btn {
    width: 42px; height: 42px; border-radius: 10px; border: 3px solid #4a3242;
    background: linear-gradient(180deg, #ffffff 0%, #ffe3f0 48%, #ffc9e2 50%, #ffffff 100%);
    font-weight: bold; cursor: pointer; color: #7a2350;
    box-shadow: 0 4px 0 #b5507e, 0 6px 10px rgba(0,0,0,0.25);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .size-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b5507e, 0 2px 4px rgba(0,0,0,0.25);
  }
  .color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; }

  /* ---- décoration ---- */
  .decorate-layout { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .undies-views { display: flex; gap: 14px; flex: 1.4; min-width: 260px; }
  .undies-view {
    flex: 1; background: #fff; border: 2px solid #ea8fb8; border-radius: 10px;
    height: 240px; position: relative; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .undies-view .view-label { position: absolute; top: 6px; left: 8px; font-size: 11px; font-weight: bold; color: #b06084; z-index: 5; }
  .undies-shape { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 130px; height: 100px; border-radius: 0 0 60px 60px / 0 0 70px 70px; }
  .decor-item-placed {
    position: absolute;
    font-size: 20px;
    width: 1em;
    height: 1em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    cursor: grab;
    user-select: none;
    touch-action: none;
    line-height: 1;
    isolation: isolate; /* le filtre de couleur ne se mélange qu'avec cet emoji, pas avec le reste de la page */
  }
  .decor-item-placed:active,
  .decor-item-placed.dragging { cursor: grabbing; z-index: 10; }

  /* L'emoji lui-même, en dessous du filtre de couleur */
  .decor-emoji { position: relative; z-index: 1; pointer-events: none; }

  /* Filtre coloré posé sur l'emoji : mix-blend-mode "color" reprend la
     teinte/saturation choisie tout en gardant les contrastes/formes de
     l'emoji d'origine, donnant un vrai rendu "teinté". */
  .decor-tint {
    position: absolute;
    inset: -1px;
    border-radius: 40%;
    mix-blend-mode: color;
    pointer-events: none;
    z-index: 2;
  }

  .decor-menu {
    flex: 1; min-width: 230px; background: #fdf3f7; border: 2px solid #ea8fb8; border-radius: 10px;
    padding: 12px; max-height: 280px; display: flex; flex-direction: column;
  }
  .decor-menu h3 { font-size: 13px; margin-bottom: 8px; color: #5a1a38; font-weight: bold; }
  .decor-list { overflow-y: auto; flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .decor-choice { background: #fff; border: 2px solid #ddd; border-radius: 8px; padding: 8px 4px; cursor: pointer; font-size: 20px; }
  .decor-choice:hover { border-color: #ea8fb8; }
  .decor-choice small { display: block; font-size: 9px; color: #999; margin-top: 2px; }
  .scroll-hint { text-align: center; font-size: 15px; color: #ea8fb8; margin-top: 4px; }

  .btn {
    padding: 11px 26px;
    border: 3px solid #4a3242;
    border-radius: 16px;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin-top: 26px;
    color: #7a2350;
    background: linear-gradient(180deg, #ffffff 0%, #ffe3f0 48%, #ffc9e2 50%, #ffffff 100%);
    box-shadow: 0 5px 0 #b5507e, 0 8px 14px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.9);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn:hover { background: linear-gradient(180deg, #ffffff 0%, #ffeef7 48%, #ffd6ea 50%, #ffffff 100%); }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #b5507e, 0 2px 4px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.9);
  }

  /* ---- bols extras ---- */
  #bowls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 18px; max-width: 780px; margin: 0 auto; }
  .bowl-card {
    background: radial-gradient(circle at 35% 30%, #ffffff, #f2d9e6 70%);
    border: 3px solid #ea8fb8; border-radius: 50% / 40%; padding: 20px 10px; cursor: pointer;
    transition: transform 0.15s ease; box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  }
  .bowl-card:hover { transform: scale(1.05); }
  .bowl-card.active { border-color: #7a2350; background: radial-gradient(circle at 35% 30%, #fff, #ffd0e8 70%); }
  .bowl-icon { font-size: 28px; margin-bottom: 6px; }
  .bowl-card b { font-size: 12px; display: block; }
  .bowl-card small { font-size: 10px; color: #888; }

  #special-request-box { display: none; margin-top: 16px; }
  #special-request-box.open { display: block; }
  #special-request-box textarea {
    width: 100%; max-width: 460px; display: block; margin: 8px auto 0; padding: 10px;
    border: 1px solid #ea8fb8; border-radius: 6px; font-family: inherit; font-size: 13px; resize: vertical; min-height: 60px;
  }

  /* ---- ticket ---- */
  #receipt-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; justify-content: center; z-index: 400; }
  #receipt-overlay.open { display: flex; }
  #receipt {
    width: 320px; max-width: 92vw; max-height: 82vh; background: #fffef2; font-family: 'Courier New', monospace;
    color: #222; padding: 20px 18px 26px; box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
    transform: translateY(100%); transition: transform 0.45s cubic-bezier(.2,.8,.2,1); overflow-y: auto; border-radius: 8px 8px 0 0; cursor: pointer;
  }
  #receipt-overlay.open #receipt { transform: translateY(0); }
  #receipt h2 { text-align: center; font-size: 16px; margin-bottom: 4px; }
  #receipt .sub { text-align: center; font-size: 10px; color: #777; margin-bottom: 12px; border-bottom: 1px dashed #999; padding-bottom: 10px; }
  .receipt-line { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .receipt-total { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; margin-top: 10px; border-top: 1px dashed #999; padding-top: 10px; }
  #receipt .note { font-size: 10px; color: #999; margin-top: 14px; text-align: center; }

  /* ---- four ---- */
  .oven { width: 170px; height: 150px; margin: 0 auto 20px; background: #7a2350; border-radius: 12px; position: relative; box-shadow: 0 10px 24px rgba(0,0,0,0.25); }
  .oven .window { position: absolute; top: 18px; left: 18px; right: 18px; height: 84px; background: #2a0f1c; border-radius: 8px; border: 4px solid #c2477a; overflow: hidden; }
  .oven .glow { position: absolute; inset: 0; background: radial-gradient(circle, #ffb84d, #ff5c9d 70%); animation: glowPulse 1s infinite ease-in-out; }
  @keyframes glowPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  .oven .knob { position: absolute; bottom: 12px; width: 14px; height: 14px; border-radius: 50%; background: #ffd7e8; }
  .oven .knob.l { left: 26px; } .oven .knob.r { right: 26px; }

  #bake-progress-wrap { width: 240px; margin: 0 auto; background: #fff; border-radius: 8px; overflow: hidden; height: 14px; box-shadow: inset 0 0 4px rgba(0,0,0,0.3); }
  #bake-progress { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb84d, #ff5c9d); transition: width 0.2s linear; }

  #oven-result { display: none; margin-top: 24px; }
  #oven-result.show { display: block; }
  #prep-time-estimate {
    background: #fdf3f7;
    border: 1px solid #ea8fb8;
    border-radius: 8px;
    padding: 10px 16px;
    margin: 14px auto 18px;
    max-width: 320px;
    font-size: 13px;
    color: #5a1a38;
  }
  #prep-time-estimate .prep-days { font-size: 20px; font-weight: bold; color: #7a2350; display: block; margin-bottom: 2px; }
  #payment-btn:disabled { opacity: 0.6; cursor: wait; }

  /* ================= FOND "CUISINE" DERRIÈRE LA DS ================= */
  #kitchen-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #e8d3b0 url('cuisine.webp') center / cover no-repeat;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #kitchen-bg.visible { opacity: 1; }
  main { position: relative; z-index: 1; }

  /* ================= RIDEAU DE THÉÂTRE ================= */
  #curtain-overlay {
    position: fixed;
    inset: 0;
    z-index: 600;
    display: none;
    pointer-events: none;
  }
  .curtain-panel {
    position: absolute;
    top: 0; bottom: 0;
    width: 52vw;
    transition: transform 0.65s cubic-bezier(.76,0,.24,1);
    overflow: hidden;
  }
  .curtain-panel.left { left: 0; transform: translateX(0); }
  .curtain-panel.right { right: 0; transform: translateX(0); }
  #curtain-overlay.open .curtain-panel.left { transform: translateX(-100%); }
  #curtain-overlay.open .curtain-panel.right { transform: translateX(100%); }

  /* Étoffe du rideau : blanc pur, sans aucun autre effet */
  .curtain-fabric {
    position: absolute;
    inset: 0;
    background: #ffffff;
  }

  /* ================= CONSOLE DS ================= */
  #ds-console {
    display: none;
    width: 400px;
    max-width: 94vw;
    margin: 30px auto;
    background: linear-gradient(#fbfbfb, #e9e9e9);
    border-radius: 26px;
    padding: 18px 20px 26px;
    box-shadow: 0 22px 44px rgba(0,0,0,0.35), inset 0 1px 0 #fff;
    position: relative;
  }
  #ds-console.open { display: block; }

  #ds-top-screen {
    background: #0e0e14;
    border-radius: 10px;
    border: 7px solid #2b2b33;
    height: 130px;
    margin-bottom: 6px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    padding: 8px;
  }
  #ds-top-content { width: 100%; }
  #ds-top-content .top-banner-text {
    font-size: 15px;
    font-weight: bold;
    color: #ff9ecb;
    text-shadow: 0 0 8px rgba(255,158,203,0.6);
  }
  #ds-top-content .top-sub { font-size: 10px; color: #bbb; margin-top: 4px; }

  .ds-speakers {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin: 6px 0 10px;
  }
  .ds-speakers span { width: 4px; height: 4px; border-radius: 50%; background: #bbb; }

  #ds-bottom-screen {
    background: #fff;
    border-radius: 10px;
    border: 7px solid #2b2b33;
    min-height: 340px;
    max-height: 52vh;
    overflow-y: auto;
    padding: 14px;
    position: relative;
  }

  .ds-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding: 0 6px;
  }
  .ds-dpad {
    width: 40px; height: 40px;
    position: relative;
  }
  .ds-dpad::before, .ds-dpad::after {
    content: '';
    position: absolute;
    background: #888;
    border-radius: 2px;
  }
  .ds-dpad::before { width: 14px; height: 40px; left: 13px; }
  .ds-dpad::after { width: 40px; height: 14px; top: 13px; }
  .ds-abxy {
    width: 44px; height: 44px;
    position: relative;
  }
  .ds-abxy span {
    position: absolute;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #999;
    font-size: 8px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ds-abxy .a { right: 0; top: 14px; }
  .ds-abxy .b { right: 14px; top: 28px; }
  .ds-abxy .x { right: 14px; top: 0; }
  .ds-abxy .y { right: 28px; top: 14px; }

  /* Dans la console, les écrans internes s'affichent sans le style "plein écran" habituel */
  #ds-bottom-screen .screen { display: none; max-width: 100%; }
  #ds-bottom-screen .screen.active { display: block; }
  #ds-bottom-screen .panel-title { font-size: 15px; margin-bottom: 14px; }
  #ds-bottom-screen .picker-row { gap: 10px; }
  #ds-bottom-screen .pantone-card,
  #ds-bottom-screen .motif-swatch-card { width: 100px; }
  #ds-bottom-screen .pantone-swatch, #ds-bottom-screen .motif-swatch { height: 60px; }
  #ds-bottom-screen #shape-grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
  #ds-bottom-screen .shape-card { padding: 10px 6px; }
  #ds-bottom-screen .shape-card .shape-icon { font-size: 24px; }
  #ds-bottom-screen .decorate-layout { gap: 10px; }
  #ds-bottom-screen .undies-view { height: 150px; }
  #ds-bottom-screen .decor-menu { max-height: 170px; min-width: 160px; }
  #ds-bottom-screen #bowls-grid { grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
  #ds-bottom-screen .bowl-card { padding: 12px 6px; }
  #ds-bottom-screen .oven { width: 130px; height: 116px; }
  #ds-bottom-screen .oven .window { height: 62px; }
  #ds-bottom-screen #bake-progress-wrap { width: 200px; }

  /* ================= MOBILE ================= */
  @media (max-width: 600px) {
    #quit-btn { top: 10px; right: 10px; padding: 6px 12px; font-size: 11px; }
    main { padding: 56px 12px 40px; }

    .picker-row { gap: 12px; }
    .pantone-card { width: 42vw; max-width: 140px; }
    .motif-swatch-card { width: 42vw; max-width: 130px; }

    #ds-console { padding: 14px 12px 20px; margin: 20px auto; border-radius: 20px; }
    #ds-top-screen { height: 110px; border-width: 5px; }
    #ds-bottom-screen { border-width: 5px; padding: 10px; max-height: none; }

    /* Devant/dos empilés à la verticale = zone plus grande pour bouger les emojis au doigt */
    #ds-bottom-screen .decorate-layout { flex-direction: column; }
    #ds-bottom-screen .undies-views { flex-direction: row; width: 100%; }
    #ds-bottom-screen .undies-view { height: 170px; }
    #ds-bottom-screen .decor-menu { width: 100%; min-width: 0; max-height: 150px; }
    #ds-bottom-screen .decor-list { grid-template-columns: repeat(5, 1fr); }
    #ds-bottom-screen .decor-choice { font-size: 18px; padding: 10px 2px; }

    #ds-bottom-screen #shape-grid { grid-template-columns: repeat(2, 1fr); }
    #ds-bottom-screen #bowls-grid { grid-template-columns: repeat(2, 1fr); }

    .ds-controls { margin-top: 10px; }
    .ds-dpad, .ds-abxy { transform: scale(0.85); }

    .btn { width: 100%; padding: 13px 20px; font-size: 14px; }
    .size-btn { width: 46px; height: 46px; }
    #receipt { width: 100%; }
  }

</style>
</head>
<body>

<div id="kitchen-bg"></div>

<div id="curtain-overlay">
  <div class="curtain-panel left">
    <div class="curtain-fabric"></div>
  </div>
  <div class="curtain-panel right">
    <div class="curtain-fabric"></div>
  </div>
</div>

<button id="quit-btn" onclick="window.location.href='index.html'">✕ Quitter</button>
<a id="legal-link-btn" href="mentions-legales.html">Mentions légales · CGV · Confidentialité</a>

<main>

  <!-- ================= 1. PANTONE (hors console) ================= -->
  <section class="screen active" id="screen-pantone">
    <div class="picker-row" id="pantone-row"></div>
  </section>

  <!-- ================= CONSOLE DS (étapes 2 à 6) ================= -->
  <div id="ds-console">

// Fait tomber les 3 cartes pantone (même animation que les post-its de la
// boutique), puis enchaîne sur l'ouverture du rideau blanc.
function dropPantoneCardsThenReveal(c) {
  order.color = c;
  playPaperCrumpleSound();

  document.querySelectorAll('#pantone-row .pantone-card').forEach(card => {
    const dx = Math.round(Math.random() * 200 - 100);
    const rot = Math.round(Math.random() * 160 - 80);
    card.style.setProperty('--fall-x', dx + 'px');
    card.style.setProperty('--fall-rot', rot + 'deg');
    card.classList.add('falling');
  });

  setTimeout(() => openCurtainToDS(), 650);
}

// Effet rideau : la page (maintenant blanche) se divise en deux et s'ouvre
// en un seul mouvement pour laisser apparaître la DS derrière.
function openCurtainToDS() {
  const overlay = document.getElementById('curtain-overlay');
  const panels = overlay.querySelectorAll('.curtain-panel');

  // 1) Affiche le rideau instantanément (sans transition) : il recouvre
  //    l'écran à l'identique de ce qui est déjà affiché, aucun à-coup visible.
  overlay.classList.remove('open');
  panels.forEach(p => { p.style.transition = 'none'; });
  overlay.style.display = 'block';
  void overlay.offsetWidth; // force le navigateur à appliquer l'état ci-dessus avant la suite

  // 2) Change la scène juste derrière, invisible car cachée par le rideau
  document.getElementById('kitchen-bg').classList.add('visible');
  goTo('motif');

  // 3) Réactive la transition puis ouvre le rideau en un seul mouvement (pas de va-et-vient)
  requestAnimationFrame(() => {
    panels.forEach(p => { p.style.transition = ''; });
    requestAnimationFrame(() => overlay.classList.add('open'));
  });

  // 4) Retire le rideau une fois l'ouverture terminée
  setTimeout(() => { overlay.style.display = 'none'; }, 750);
}

function placeDecorOnGarment(item, colorHex) {

  const side = frontCount <= backCount ? 'front' : 'back';

  renderPlacedDecor();

function renderPlacedDecor() {
  ['front', 'back'].forEach(side => {
    document.getElementById('view-' + side).querySelectorAll('.decor-item-placed').forEach(e => e.remove());
  });

    el.style.top = d.y + '%';
    el.innerHTML = `<span class="decor-emoji">${d.icon}</span><span class="decor-tint" style="background:${d.color || '#ffffff'};"></span>`;
    view.appendChild(el);
    makeDecorDraggable(el, d);

// Clic (ou toucher) et maintien pour déplacer librement un élément, y compris
// d'une vue à l'autre (devant <-> dos), il change alors de côté.
function makeDecorDraggable(el, dataObj) {
  let dragging = false;
  const viewFront = document.getElementById('view-front');
  const viewBack = document.getElementById('view-back');

  function containerForPoint(clientX, clientY) {
    for (const view of [viewFront, viewBack]) {
      const r = view.getBoundingClientRect();
      if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) return view;
    }
    return null;
  }

  function startDrag(clientX, clientY) {
    dragging = true;
    el.classList.add('dragging');
  }

  function moveDrag(clientX, clientY) {
    if (!dragging) return;
    const hovered = containerForPoint(clientX, clientY);
    const container = hovered || el.parentElement;

    const newSide = container === viewFront ? 'front' : 'back';
    if (newSide !== dataObj.side) {
      dataObj.side = newSide;
      container.appendChild(el); // passe visuellement de l'autre côté
    }

    const rect = container.getBoundingClientRect();
    let px = ((clientX - rect.left) / rect.width) * 100;
    let py = ((clientY - rect.top) / rect.height) * 100;
    px = Math.max(4, Math.min(96, px));
    py = Math.max(4, Math.min(96, py));
    dataObj.x = px;
    dataObj.y = py;
    el.style.left = px + '%';
    el.style.top = py + '%';
  }

  function endDrag() {
    dragging = false;
    el.classList.remove('dragging');
  }

  el.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  document.addEventListener('mouseup', endDrag);

  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const t = e.touches[0];
    moveDrag(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener('touchend', endDrag);
}

/* ======================= TICKET ======================= */
function playCashSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1320].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'square';
      gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.08);
      osc.stop(ctx.currentTime + i * 0.08 + 0.25);
    });
  } catch (e) {}
}
function shapeName(id) { const s = SHAPES.find(x => x.id === id); return s ? s.name : 'Création'; }

// Estimation du délai de préparation : base + complexité (déco, extras, demande spéciale)
function estimatePrepTime() {
  let days = 3; // délai de base pour une pièce sur mesure
  days += Math.ceil(order.decor.length / 3); // chaque groupe de 3 déco ajoute un jour
  const nonSpecialExtras = order.extras.filter(id => id !== 'special');
  if (nonSpecialExtras.length > 0) days += 1;
  if (order.extras.includes('special') && order.specialRequest) days += 2;
  return { min: days, max: days + 2 };
}

function mixAndShowReceipt() {
  order.specialRequest = document.getElementById('special-request-text').value.trim();
  const lines = [];
  let total = 0;

  const basePrice = BASE_PRICE[order.shape] || 25;
  lines.push({ label: `${shapeName(order.shape)} (taille ${order.size || '-'})`, price: basePrice });
  total += basePrice;

  if (order.motif) { lines.push({ label: `Motif "${order.motif.name}"`, price: 3 }); total += 3; }

  order.decor.forEach(d => { lines.push({ label: `${d.icon} ${d.name}`, price: d.price }); total += d.price; });

  order.extras.forEach(id => {
    const extra = EXTRAS.find(e => e.id === id);
    if (!extra) return;
    if (extra.special) {
      const requestPrice = order.specialRequest ? 8 : 0;
      lines.push({ label: `📝 Demande spéciale${order.specialRequest ? '' : ' (non précisée)'}`, price: requestPrice });
      total += requestPrice;
    } else {
      lines.push({ label: `${extra.icon} ${extra.name}`, price: extra.price });
      total += extra.price;
    }
  });

  document.getElementById('receipt').innerHTML = `
    <h2>LARYNE.EXE</h2>
    <div class="sub">Commande personnalisée — ${new Date().toLocaleString('fr-FR')}</div>
    ${lines.map(l => `<div class="receipt-line"><span>${l.label}</span><span>${l.price.toFixed(2)} €</span></div>`).join('')}
    <div class="receipt-total"><span>TOTAL</span><span>${total.toFixed(2)} €</span></div>
    ${order.specialRequest ? `<div class="note">Note : "${order.specialRequest}"</div>` : ''}
    <div class="note">Clique sur le ticket pour continuer 💗</div>
  `;
  document.getElementById('receipt-overlay').classList.add('open');
  playCashSound();
  order.total = total;
}
document.getElementById('receipt').addEventListener('click', () => {
  document.getElementById('receipt-overlay').classList.remove('open');
  goTo('oven');
});

/* ======================= 6. CUISSON ======================= */
function startBaking() {
  document.getElementById('oven-result').classList.remove('show');
  const bar = document.getElementById('bake-progress');
  bar.style.width = '0%';
  let pct = 0;
  const interval = setInterval(() => {
    pct += 4;
    bar.style.width = Math.min(pct, 100) + '%';
    if (pct >= 100) {
      clearInterval(interval);
      document.getElementById('oven-title').textContent = 'Ta culotte est prête !';

      const est = estimatePrepTime();
      document.getElementById('prep-time-estimate').innerHTML =
        `<span class="prep-days">${est.min} à ${est.max} jours ouvrés</span>Temps de préparation estimé avant expédition`;

      document.getElementById('oven-result').classList.add('show');
    }
  }, 120);
}

// Envoie la commande personnalisée vers la vraie page de paiement (Stripe),
// exactement comme le panier de la boutique — pas de raccourci vers success.html.
// Important : on envoie les CHOIX (forme, motif, décors, options) et pas un
// prix déjà calculé, pour que le serveur (api/create-checkout-session.js)
// puisse recalculer lui-même le montant à partir de son propre tarif et
// ignorer toute tentative de modification du prix depuis le navigateur.
async function goToPayment() {
  const btn = document.getElementById('payment-btn');
  btn.disabled = true;
  btn.textContent = 'Redirection vers le paiement...';

  try {
    const response = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        customOrder: {
          shapeId: order.shape,
          motifId: order.motif ? order.motif.id : null,
          decorIds: (order.decor || []).map(d => d.id),
          extraIds: (order.extras || []).map(e => e.id),
          specialRequest: order.specialRequest || '',
          size: order.size || '',
        },
      }),
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(data.error || `Erreur serveur (${response.status})`);
    }

    // Mémorise un récapitulatif (affichage uniquement) pour la page de
    // remerciement — le montant réellement facturé est celui recalculé par
    // le serveur dans api/create-checkout-session.js, pas celui-ci.
    let email = '';
    try {
      const userJson = localStorage.getItem('stringzUser');
      if (userJson) email = JSON.parse(userJson).email || '';
    } catch (e) { /* ignore */ }
    stringzSetPendingOrder({
      source: 'commande_perso',
      items: [{ name: `Création sur mesure (taille ${order.size || '-'})`, qty: 1, unitPrice: order.total || 0 }],
      total: order.total || 0,
      email,
    });

    window.location.href = data.url; // vraie page de paiement Stripe
  } catch (err) {
    console.error(err);
    alert("Le paiement n'a pas pu être initié :\n" + err.message);
    btn.disabled = false;
    btn.textContent = '💳 Passer au paiement';
  }
}
